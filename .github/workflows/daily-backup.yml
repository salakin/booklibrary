name: Daily database backup

on:
  schedule:
    - cron: "0 20 * * *" # 02:00 Bangladesh time (UTC+6)
  workflow_dispatch: # allows running it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4

      - name: Check out backups branch
        uses: actions/checkout@v4
        with:
          ref: backups
          path: backup-branch

      - name: Export all books and posts
        run: python3 scripts/backup.py backup-branch/lawbusiness-backup.json

      - name: Commit and push the backup
        working-directory: backup-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          counts=$(python3 -c "import json; c = json.load(open('lawbusiness-backup.json', encoding='utf-8'))['counts']; print(f\"{c['books']} books, {c['posts']} posts\")")
          git add lawbusiness-backup.json
          git commit -m "Backup $(date -u +%F): $counts"
          git push
